name: Dependency Resolution

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-resolution.yml"
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-cpu-profile-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the pinned CPU profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --ignore-installed -r requirements-core.txt

  optional-extra-resolution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - markitdown
          - paddleocr
          - mineru
          - docling
          - opendataloader

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve ${{ matrix.extra }} in isolation
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --ignore-installed -e ".[${{ matrix.extra }}]"

  watched-version-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install policy test dependencies
        run: python -m pip install "packaging>=25,<27" pytest

      - name: Verify watched versions remain inside supported ranges
        run: python -m pytest tests/test_upstream_dependency_policy.py -q
