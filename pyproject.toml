[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-to-markdown-converter"
version = "0.2.0"
description = "Formula-aware document-to-Markdown conversion toolkit with Python, CLI, FastAPI, and multi-engine OCR"
authors = [{name = "Ferry He", email = "ferry.he@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["markdown", "ocr", "pdf", "document-conversion", "formula-ocr", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "typer>=0.26.8,<1.0",
    "rich>=13.7,<16.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "click>=8.3.3,<9.0",
    "pypdf>=6.13,<7.0",
    "mistralai==2.10.0",
    "openai==2.54.0",
    "python-docx>=1.2,<2.0",
    "pillow>=12.2,<13.0",
    "pytesseract==0.3.13",
    "tiktoken>=0.7,<1.0",
]

[project.urls]
Homepage = "https://github.com/ferryhe/doc_to_md"
Repository = "https://github.com/ferryhe/doc_to_md"
Issues = "https://github.com/ferryhe/doc_to_md/issues"

[project.scripts]
doc-to-md = "doc_to_md.cli:app"
doc-to-md-api = "doc_to_md.api:run"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.9,<1"]
html = ["trafilatura>=1.6,<2", "beautifulsoup4>=4.12,<5"]
office = ["python-pptx>=0.6,<2", "openpyxl>=3.1,<4"]
markitdown = ["markitdown[pdf]>=0.1.7,<0.2"]
paddleocr = ["paddleocr>=3.7,<4", "pypdfium2>=4.30.0,<6"]
mineru = ["mineru[pipeline]>=3.4.5,<4"]
docling = ["docling>=2.123,<3"]
opendataloader = ["opendataloader-pdf>=2.5.5,<3"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["doc_to_md*"]

[tool.setuptools.package-data]
doc_to_md = ["py.typed"]
